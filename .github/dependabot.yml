# Documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # gitHub actions dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    groups:
      # matching packages that must update together
      vitest-ecosystem:
        patterns:
          - 'vitest'
          - '@vitest/*'

      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

      npm-production:
        dependency-type: production
        update-types:
          - patch
